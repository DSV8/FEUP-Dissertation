paths:
  cache_dir: "cache/multimodal/pre_post/cf_io"

training:
  num_epochs: 200
  batch_size: 128
  learning_rate: 0.0002
  weight_decay: 0.0003
  gain: "linear"
  image_embedding_mode: "precomputed"
  resume_training: false

model:
  variant: "NCF"
  projection_dim: 64
  fm_k: 8
  hidden_dims: [256, 128, 64, 32]
  ncf_fusion_heads: 1
  ncf_fusion_layers: 1
  ncf_fusion_dim: 64
  ncf_fusion_mode: "cross_attention"
  dropout: 0.2

loader:
  num_workers: 0
  pin_memory: false
  persistent_workers: false
  prefetch_factor: 2
