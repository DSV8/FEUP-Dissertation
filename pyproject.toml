[project]
name = "retrieval"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "matplotlib>=3.10.8",
  "numpy>=2.4.3",
  "pyyaml>=6.0",
  "timm>=1.0.15",
  "torch==2.5.1+cu121; sys_platform == 'linux'",
  "torchvision==0.20.1+cu121; sys_platform == 'linux'",
  "torch==2.5.1; sys_platform != 'linux'",
  "torchvision==0.20.1; sys_platform != 'linux'",
  "wandb>=0.16.0",
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", marker = "sys_platform != 'linux'" },
  { index = "pytorch-cu121", marker = "sys_platform == 'linux'" },
]
torchvision = [
  { index = "pytorch-cpu", marker = "sys_platform != 'linux'" },
  { index = "pytorch-cu121", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true
